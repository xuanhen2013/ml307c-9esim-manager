name: Legacy Debian package (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          build_time=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')
          short_sha="${GITHUB_SHA::7}"
          version="v${build_time}-${short_sha}"
          echo "tag=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${build_time}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Python scripts
        run: |
          python -m py_compile deploy/shared/notification_utils.py
          python -m py_compile deploy/web_admin/4g_wifi_admin.py
          python -m py_compile deploy/sms_forwarder/sms_forwarder.py

      - name: Sync built frontend into deploy assets
        run: |
          rm -rf deploy/web_admin/frontend_dist
          mkdir -p deploy/web_admin/frontend_dist
          cp -a frontend/dist/. deploy/web_admin/frontend_dist/

      - name: Build deploy zip
        run: |
          python scripts/build_deploy_package.py \
            --output dist/eSIM-SMS-Forwarder-deploy-${{ steps.version.outputs.tag }}.zip \
            --copy-to dist/eSIM-SMS-Forwarder-deploy.zip

      - name: Build lpac asset manifest
        run: |
          python scripts/build_lpac_manifest.py \
            --assets-dir deploy/esim \
            --output dist/lpac-assets.json

      - name: Collect lpac bundles
        run: |
          find deploy/esim -maxdepth 1 -type f -name 'lpac-linux-*.zip' -exec cp {} dist/ \;

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: eSIM-SMS-Forwarder-deploy-${{ steps.version.outputs.tag }}
          path: |
            dist/eSIM-SMS-Forwarder-deploy-${{ steps.version.outputs.tag }}.zip
            dist/eSIM-SMS-Forwarder-deploy.zip
            dist/lpac-assets.json
            dist/lpac-linux-*.zip
          if-no-files-found: error
